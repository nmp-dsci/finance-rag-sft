[project]
name = "finance-rag-sft"
version = "0.1.0"
description = "Finance RAG retriever: does a fine-tuned bge-base put the golden passage in the top 10 more often than the untouched base?"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  # The model, the trainer and the retrievers. torch comes from PyTorch's CUDA / CPU index on
  # Linux (see tool.uv.sources) and from PyPI on macOS, which carries the MPS build.
  "torch>=2.8",
  "sentence-transformers>=6.1,<7",
  "transformers>=4.57",
  "accelerate>=1.0",
  "datasets>=3.2",
  "huggingface-hub>=0.26",
  "pyarrow>=17",
  "numpy>=2.0",
  "scipy>=1.14",
  "bm25s>=0.3.11",
  "pystemmer>=3.1.0",
  # tracking, CLI and the viewer's API
  "mlflow>=3.12,<4",
  "typer>=0.15",
  "rich>=13.9",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[project.scripts]
finrag = "finance_rag_sft.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.14.2",
  "mypy>=1.13",
  "types-PyYAML",
  "httpx>=0.27",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_rag_sft"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["finance_rag_sft"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["datasets.*", "mlflow.*", "pyarrow.*", "huggingface_hub.*", "bm25s.*", "Stemmer", "torch.*", "sentence_transformers.*", "transformers.*", "scipy.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:warnings"
markers = ["slow: downloads a model or the dataset; skipped unless FINRAG_SLOW=1"]
