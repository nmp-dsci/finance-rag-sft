name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — lint, types, tests
    runs-on: ubuntu-latest
    # Every test is offline: no dataset, no model, no MLflow.
    env:
      UV_NO_SYNC: "1"  # keep `uv run` from installing the torch the sync below skips
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      # torch (and its CUDA wheels on x86_64) is imported lazily and no test needs it
      - run: uv sync --python 3.12 --frozen --no-install-package torch
      - run: uv run ruff check --no-fix src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest -q

  frontend:
    name: Frontend — types, design lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:design
      - run: npm test
      - run: npm run build
